
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

            - name: Generate android folder if missing
        run: |
          if [ ! -d android ]; then
            flutter create --org sd.rates --project-name sudan_rates .
          fi

      - name: Android setup (permissions + desugaring)
        run: python3 tool/android_setup.py

      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: sudan-rates-apk
          path: build/app/outputs/flutter-apk/app-release.apk