name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate android folder if missing
        run: |
          if [ ! -d android ]; then
            flutter create --org sd.rates --project-name exchange_rates .
          fi

      - name: Set app display name
        run: |
          sed -i 's|android:label="[^"]*"|android:label="Exchange Rates"|' android/app/src/main/AndroidManifest.xml

      - name: Android setup (permissions + desugaring + notification icon)
        run: python3 tool/android_setup.py

      - run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: exchange-rates-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk