name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # غيّر هذا الرقم يدوياً عند التحديثات الكبيرة (2.0 ← 2.1 ← 3.0)
  MAJOR_MINOR: "2.0"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate android folder if missing
        run: |
          if [ ! -d android ]; then
            flutter create --org sd.rates --project-name exchange_rates .
          fi

      - name: Set app display name
        run: |
          sed -i 's|android:label="[^"]*"|android:label="Exchange Rates"|' android/app/src/main/AndroidManifest.xml

      - name: Android setup (permissions + desugaring + notification icon)
        run: python3 tool/android_setup.py

      - run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Build APK
        run: |
          flutter build apk --release \
            --build-name=${{ env.MAJOR_MINOR }}.${{ github.run_number }} \
            --build-number=${{ github.run_number }}

      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/exchange-rates-v${{ env.MAJOR_MINOR }}.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: exchange-rates-apk
          path: build/app/outputs/flutter-apk/exchange-rates-v*.apk

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.MAJOR_MINOR }}.${{ github.run_number }}
          name: v${{ env.MAJOR_MINOR }}.${{ github.run_number }}
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/exchange-rates-v*.apk